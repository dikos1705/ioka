[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ioka-flight-booking"
version = "1.0.0"
description = "Asynchronous flight search, booking and ticket issuing service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.36,<2.1",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "redis>=5.2,<7",
  "aio-pika>=9.5,<10",
  "reportlab>=4.2,<5",
  "alembic>=1.14,<2",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

